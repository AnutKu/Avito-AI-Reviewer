services:
  postgres:
    image: postgres:16-alpine
    container_name: avito-ai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avito}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-avito}
      POSTGRES_DB: ${POSTGRES_DB:-avito_ai_reviewer}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avito} -d ${POSTGRES_DB:-avito_ai_reviewer}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-reviewer:
    build: ./ai-reviewer
    container_name: avito-ai-reviewer
    environment:
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_MODEL: ${ZAI_MODEL:-glm-5.3-flash}
      ZAI_REASONING_EFFORT: ${ZAI_REASONING_EFFORT:-low}
      ZAI_TIMEOUT_SECONDS: ${ZAI_TIMEOUT_SECONDS:-120}
      # Один и тот же лимит у api и ai-reviewer: снапшот режет только тот,
      # кто его собирает. Расхождение = молча потерянный хвост решения.
      MAX_SNAPSHOT_CHARS: ${MAX_SNAPSHOT_CHARS:-120000}
    ports:
      - "${AI_REVIEWER_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    container_name: avito-ai-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-avito}:${POSTGRES_PASSWORD:-avito}@postgres:5432/${POSTGRES_DB:-avito_ai_reviewer}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      SEED_ON_START: ${SEED_ON_START:-true}
      # По умолчанию любой источник — чтобы кабинет открывался и у коллег
      # с других машин (по IP/сетевому имени), а не только на localhost.
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      AI_REVIEWER_URL: http://ai-reviewer:8010
      # Движок конструктора заданий. В него ходит только api: задание хранит
      # кабинет, поэтому браузеру этот адрес знать незачем.
      TASKCREATER_URL: http://taskcreater:8000
      AI_REVIEWER_MODEL: ${ZAI_MODEL:-glm-5.3-flash}
      AI_REVIEWER_TIMEOUT_SECONDS: ${AI_REVIEWER_TIMEOUT_SECONDS:-150}
      MAX_SNAPSHOT_CHARS: ${MAX_SNAPSHOT_CHARS:-120000}
      AI_REVIEW_MAX_ATTEMPTS: ${AI_REVIEW_MAX_ATTEMPTS:-2}
      AI_REVIEW_RETRY_DELAY_SECONDS: ${AI_REVIEW_RETRY_DELAY_SECONDS:-3}
      AI_REVIEW_STALE_AFTER_SECONDS: ${AI_REVIEW_STALE_AFTER_SECONDS:-600}
      FEATURE_DISTRIBUTION: ${FEATURE_DISTRIBUTION:-true}
      FEATURE_RUBRIC_BUILDER: ${FEATURE_RUBRIC_BUILDER:-true}
      FEATURE_ANALYTICS: ${FEATURE_ANALYTICS:-true}
      FEATURE_BLITZ: ${FEATURE_BLITZ:-true}
      FEATURE_AI_DETECTION: ${FEATURE_AI_DETECTION:-true}
      DETECTION_BLITZ_THRESHOLD: ${DETECTION_BLITZ_THRESHOLD:-70}
      DETECTION_WEIGHTS: ${DETECTION_WEIGHTS:-{}}
      FEATURE_COURSE_DEBT: ${FEATURE_COURSE_DEBT:-false}
      FEATURE_TELEGRAM: ${FEATURE_TELEGRAM:-false}
    ports:
      - "${API_PORT:-8081}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-reviewer:
        condition: service_healthy
      # Не service_healthy: конструктор нужен только по требованию, и его
      # недоступность кабинет переживает — отвечает 503 и сохраняет черновик.
      taskcreater:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  ui:
    build: ./ui
    container_name: avito-ai-ui
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      taskcreater:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- AI-помощник лектора: конструктор ДЗ + валидация критериев агентами ---
  # Ходит в тот же контейнер postgres, но в СВОЮ базу `taskcreater`
  # (создаётся сервисом при старте) — схема не пересекается с core api.
  taskcreater:
    build: ./task-creater
    container_name: avito-ai-taskcreater
    environment:
      TASKCREATER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-avito}:${POSTGRES_PASSWORD:-avito}@postgres:5432/taskcreater
      # LLM: OpenAI-совместимый шлюз (провайдер-агностик через litellm).
      # По умолчанию сервис поднимается в fake-режиме (детерминированные ответы,
      # без вызовов LLM) — как и остальные AI-модули этого этапа. Для реальных
      # прогонов задайте креды шлюза в .env и TASKCREATER_LLM_FAKE=0.
      TASKCREATER_LLM_FAKE: ${TASKCREATER_LLM_FAKE:-1}
      # префикс, под которым сервис проксируется единым кабинетом (ui/nginx.conf)
      TASKCREATER_ROOT_PATH: /task-creater
      TASKCREATER_LLM_API_BASE: ${TASKCREATER_LLM_API_BASE:-}
      TASKCREATER_LLM_API_KEY: ${TASKCREATER_LLM_API_KEY:-}
      TASKCREATER_MODEL_FAST: ${TASKCREATER_MODEL_FAST:-google/gemini-3.5-flash-lite}
      TASKCREATER_MODEL_SMART: ${TASKCREATER_MODEL_SMART:-google/gemini-3.6-flash}
      TASKCREATER_RUB_PER_USD: ${TASKCREATER_RUB_PER_USD:-90}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TASKCREATER_LANGFUSE_PUBLIC_KEY: ${TASKCREATER_LANGFUSE_PUBLIC_KEY:-}
      TASKCREATER_LANGFUSE_SECRET_KEY: ${TASKCREATER_LANGFUSE_SECRET_KEY:-}
    ports:
      - "${TASKCREATER_PORT:-8082}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Часть ручек кабинета — живые вызовы модели (заполнение блока задания).
        # Дефолтных 60 секунд им не хватает, и пользователь видел 504 вместо
        # результата. Длинные операции всё равно фоновые, это запас для коротких.
        proxy_read_timeout 180s;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    # AI-помощник лектора (services/task-creater). Префикс срезается, сервис
    # знает про него через root_path — Swagger доступен на /task-creater/docs.
    location /task-creater/ {
        proxy_pass http://taskcreater:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
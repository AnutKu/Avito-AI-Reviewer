services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskcreater
      POSTGRES_PASSWORD: taskcreater
      POSTGRES_DB: taskcreater
    ports:
      - "${TASKCREATER_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskcreater -d taskcreater"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      TASKCREATER_DATABASE_URL: postgresql+asyncpg://taskcreater:taskcreater@db:5432/taskcreater
      # --- LLM: OpenAI-совместимый шлюз (провайдер-агностик через litellm) ---
      TASKCREATER_LLM_API_BASE: ${TASKCREATER_LLM_API_BASE:-}
      TASKCREATER_LLM_API_KEY: ${TASKCREATER_LLM_API_KEY:-}
      TASKCREATER_MODEL_FAST: ${TASKCREATER_MODEL_FAST:-gpt-4o-mini}
      TASKCREATER_MODEL_SMART: ${TASKCREATER_MODEL_SMART:-gpt-4o}
      TASKCREATER_RUB_PER_USD: ${TASKCREATER_RUB_PER_USD:-90}
      # Оффлайн-режим: 1 — детерминированные ответы без вызовов LLM (демо/тесты)
      TASKCREATER_LLM_FAKE: ${TASKCREATER_LLM_FAKE:-0}
      # --- Родные ключи провайдеров (читает сам litellm) ---
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # --- Наблюдаемость (опционально) ---
      TASKCREATER_LANGFUSE_PUBLIC_KEY: ${TASKCREATER_LANGFUSE_PUBLIC_KEY:-}
      TASKCREATER_LANGFUSE_SECRET_KEY: ${TASKCREATER_LANGFUSE_SECRET_KEY:-}
      TASKCREATER_LANGFUSE_HOST: ${TASKCREATER_LANGFUSE_HOST:-http://localhost:3000}
    ports:
      - "${TASKCREATER_PORT:-8000}:8000"

volumes:
  pgdata:
